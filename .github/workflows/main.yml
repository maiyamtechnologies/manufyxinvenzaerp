name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Deploy flags ─────────────────────────────────────────────────────────────
  # Read the commit tags ONCE, here, and let both jobs below branch on the answer.
  # The alternative -- repeating a contains() expression in two `if:` conditions --
  # has a failure mode worth avoiding: if the two ever disagree, the test job is
  # skipped while the deploy job still waits for it, and the pipeline hangs on a
  # job that will never run.
  #
  # Both the merge commit and every commit in the push are searched. The merge
  # commit is the reliable one (auto-merge-devbranch.yml puts the tag there on
  # purpose), and the rest covers a direct push to main that was never merged.
  prepare:
    name: Read deploy flags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      urgent: ${{ steps.flags.outputs.urgent }}
      tag: ${{ steps.flags.outputs.tag }}
    steps:
      - name: Detect [urgentfix]
        id: flags
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          ALL_MSGS: ${{ toJson(github.event.commits.*.message) }}
        run: |
          set -e
          if printf '%s\n%s' "$HEAD_MSG" "$ALL_MSGS" | grep -qF '[urgentfix]'; then
            echo "urgent=true" >> "$GITHUB_OUTPUT"
            echo "tag=urgentfix" >> "$GITHUB_OUTPUT"
            echo "[urgentfix] found — the test suite will be SKIPPED for this deploy."
          else
            echo "urgent=false" >> "$GITHUB_OUTPUT"
            echo "tag=autodeploy" >> "$GITHUB_OUTPUT"
            echo "No [urgentfix] tag — the test suite runs as usual."
          fi

  # ── Test gate ────────────────────────────────────────────────────────────────
  # Runs the app's full pytest/unittest suite (tests/) against a throwaway site
  # before the deploy job below is allowed to run. This is a new addition
  # (Phase 1 / HP-08, Report 3 Finding M-07) — previously this pipeline had no
  # test-execution step at all, so a regression the existing suite would catch
  # could still reach production. Runs on its own ephemeral MariaDB/Redis
  # instance, never against the production site — the deploy job is unchanged
  # below and still SSHes into production separately.
  test:
    name: Run App Test Suite
    runs-on: ubuntu-latest
    needs: prepare
    # [urgentfix] skips the gate. Everything after it is unchanged -- same backup,
    # same rollback, same log -- so what is being traded away is the warning, not
    # the safety net. The Deploy Log record is stamped Tests Skipped so a deploy
    # that went out untested stays identifiable long after the run has scrolled by.
    if: needs.prepare.outputs.urgent != 'true'
    # A whole-job cap. Individual steps carry their own where they are known to
    # be able to hang; this is the backstop so a run can never sit for an hour.
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Notify Telegram - Deployment started
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Deployment process initiated for Manufyxinvenza"

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7
        with:
          path: manufyxinvenzaerp

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install system dependencies
        id: install-sysdeps
        # Was hanging for 6+ minutes and then being cancelled. Three changes:
        #
        #  * Only two packages are actually needed. redis comes from the service
        #    containers above on the very ports bench expects (13000/11000), so
        #    installing redis-server was pointless; wkhtmltopdf is only used to
        #    render PDFs at runtime, which no test does, and it drags in the whole
        #    X11 and font stack.
        #  * apt is told to give up on a stalled mirror instead of waiting on it
        #    forever, which is what the silence in the log was.
        #  * The step is capped, so a bad mirror costs four minutes and a clear
        #    failure rather than an open-ended hang someone has to cancel by hand.
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail

          need=""
          command -v mysql >/dev/null 2>&1 || need="$need mariadb-client"
          # mysqlclient builds against this; frappe v15 uses pymysql, but a
          # transitive dependency can still want the headers.
          dpkg -s libmysqlclient-dev >/dev/null 2>&1 || need="$need libmysqlclient-dev"

          if [ -z "$need" ]; then
            echo "Nothing to install — the runner image already has what is needed."
            exit 0
          fi

          echo "Installing:$need"
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=20 \
                    -o Acquire::https::Timeout=20 \
                    -o Acquire::ForceIPv4=true"

          # A single archive rather than the runner's mirror list: when one entry
          # in that list stalls, apt waits on it, and that is the hang.
          sudo -E apt-get $APT_OPTS update
          sudo -E apt-get $APT_OPTS install -y --no-install-recommends $need

      - name: Install bench
        id: install-bench
        run: pip install frappe-bench

      - name: Init bench + get apps
        id: init-bench
        run: |
          bench init --skip-redis-config-generation --python "$(which python3)" --frappe-branch version-15 test-bench
          cd test-bench
          bench get-app erpnext --branch version-15
          bench get-app hrms --branch version-15
          bench get-app india_compliance https://github.com/resilient-tech/india-compliance.git --branch version-15
          bench get-app manufyxinvenzaerp "$GITHUB_WORKSPACE/manufyxinvenzaerp"

      - name: Configure site + install apps
        id: configure-site
        working-directory: test-bench
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-config -g root_login root
          bench set-config -g root_password root
          bench new-site test-site.local --force \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test-site.local install-app erpnext
          bench --site test-site.local install-app hrms
          bench --site test-site.local install-app india_compliance
          bench --site test-site.local install-app manufyxinvenzaerp

      - name: Run test suite
        id: run-tests
        working-directory: test-bench
        run: bench --site test-site.local run-tests --app manufyxinvenzaerp

      - name: Notify Telegram - Test environment completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Completed test environment, moving to live server update"

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout) STEP_DESC="Checkout code" ;;
            setup-python) STEP_DESC="Setup Python" ;;
            setup-node) STEP_DESC="Setup Node" ;;
            install-sysdeps) STEP_DESC="Install system dependencies" ;;
            install-bench) STEP_DESC="Install bench" ;;
            init-bench) STEP_DESC="Init bench + get apps" ;;
            configure-site) STEP_DESC="Configure site + install apps" ;;
            run-tests) STEP_DESC="Run test suite" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. Remaining steps stopped, deploy will not run."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: [prepare, test]
    timeout-minutes: 30
    # The live server is only touched when the repository variable LIVE_DEPLOY is
    # set to "true" (Settings → Secrets and variables → Actions → Variables).
    # With it unset the test gate still runs on every push, so the pipeline can be
    # exercised and watched without deploying anything.
    #
    # The rest of this condition is what lets [urgentfix] through. A skipped `needs`
    # job normally skips everything downstream, so a plain `needs: test` would mean
    # an urgent fix merged and then deployed nothing at all -- the quietest possible
    # way to fail. !cancelled() lifts that, and the explicit result check puts the
    # gate back: success or skipped may deploy, FAILED may not. Spelling out the two
    # allowed results rather than writing `!= 'failure'` also covers a test job that
    # ends up cancelled or timed out.
    if: >-
      !cancelled()
      && vars.LIVE_DEPLOY == 'true'
      && needs.prepare.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        id: checkout-deploy
        uses: actions/checkout@v7

      - name: Deploy to Frappe Server
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
          TESTS_SKIPPED: ${{ needs.prepare.outputs.urgent == 'true' && '1' || '0' }}
        with:
          # Forwarded into the remote shell so the Deploy Log record can say how
          # this deploy was started and whether the suite ran. Only these two --
          # the commit sha, message and branch are read from git on the server,
          # because a commit message with a quote in it would otherwise have to
          # survive a round trip through two shells.
          envs: DEPLOY_TAG,TESTS_SKIPPED
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            # ── Setup ────────────────────────────────────────────────────────
            BENCH_PATH="/home/manufyxv15/frappe-bench"
            APP_PATH="$BENCH_PATH/apps/manufyxinvenzaerp"
            LOG_DIR="$BENCH_PATH/Auto-deploy-logs"
            LOG_FILE="$LOG_DIR/deploy_$(date +'%Y-%m-%d_%H-%M-%S').log"
            SITE="erp.manufyx.co.in"
            DEPLOY_STARTED="$(date +'%Y-%m-%d %H:%M:%S')"
            DEPLOY_TAG="${DEPLOY_TAG:-autodeploy}"
            TESTS_SKIPPED="${TESTS_SKIPPED:-0}"
            BACKUP_FILE=""
            ROLLBACK_COMMIT=""

            mkdir -p "$LOG_DIR"

            # ── Deploy Log → ERP ─────────────────────────────────────────────
            # The log this script writes lives on the server, readable only over
            # SSH -- which is exactly the person who cannot read it when a deploy
            # fails out of hours. This copies the same log into a Deploy Log record
            # so it can be read, and its status seen, from the ERP itself.
            #
            # Every call is swallowed. A deploy that actually worked must never be
            # reported as failed because recording it failed: `|| true` here, and
            # the Python side catches everything as well. It is also why this is
            # never called before Step 1 -- on a server mid-upgrade the function may
            # not exist yet, and a missing function is not a reason to stop.
            # Built up in one variable rather than a multi-line command: every line
            # of this script sits inside a YAML block scalar, and a backslash
            # continuation that starts at column 0 ends the block early and breaks
            # the whole workflow file.
            record_deploy_log() {
              STATUS="$1"
              FAILED_STEP="${2:-}"
              cd "$BENCH_PATH" 2>/dev/null || return 0
              KW="{'status': '$STATUS'"
              KW="$KW, 'log_file': '$LOG_FILE'"
              KW="$KW, 'started': '$DEPLOY_STARTED'"
              KW="$KW, 'site': '$SITE'"
              KW="$KW, 'backup_file': '$BACKUP_FILE'"
              KW="$KW, 'rollback_commit': '$ROLLBACK_COMMIT'"
              KW="$KW, 'failed_step': '$FAILED_STEP'"
              KW="$KW, 'trigger_tag': '$DEPLOY_TAG'"
              KW="$KW, 'tests_skipped': '$TESTS_SKIPPED'}"
              bench --site "$SITE" execute manufyxinvenzaerp.deploy_log.record --kwargs "$KW" >/dev/null 2>&1 || true
            }

            echo "============================================" | tee -a "$LOG_FILE"
            echo " AUTO DEPLOY STARTED"                        | tee -a "$LOG_FILE"
            echo " Date     : $(date)"                         | tee -a "$LOG_FILE"
            echo " App Path : $APP_PATH"                       | tee -a "$LOG_FILE"
            echo " Site     : $SITE"                           | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"

            # ── Step 0: Backup, before anything is touched ───────────────────
            # Nothing below runs until there is a database backup on disk and it
            # has actually been written. A deploy that cannot be undone is not a
            # deploy anyone should start.
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 0/6] Backup — taken before any change" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            cd "$BENCH_PATH" || { echo "ERROR: Bench path not found" | tee -a "$LOG_FILE"; exit 1; }

            bench --site "$SITE" backup 2>&1 | tee -a "$LOG_FILE"
            BACKUP_STATUS=${PIPESTATUS[0]}
            if [ $BACKUP_STATUS -ne 0 ]; then
              echo "ERROR: backup failed with exit code $BACKUP_STATUS — deploy aborted" | tee -a "$LOG_FILE"
              echo "Nothing has been changed on the server." | tee -a "$LOG_FILE"
              exit 1
            fi

            BACKUP_DIR="$BENCH_PATH/sites/$SITE/private/backups"
            FRESH=$(ls -t "$BACKUP_DIR"/*-database.sql.gz 2>/dev/null | head -n1)

            if [ -z "$FRESH" ] || [ ! -s "$FRESH" ]; then
              echo "ERROR: no non-empty backup file found in $BACKUP_DIR — deploy aborted" | tee -a "$LOG_FILE"
              echo "Nothing has been changed on the server." | tee -a "$LOG_FILE"
              exit 1
            fi

            # The file has to be readable as a gzip archive, not merely present.
            # A truncated or half-written dump passes an existence check and then
            # fails at the moment it is actually needed, which is the worst
            # possible time to discover it.
            if ! gzip -t "$FRESH" 2>&1 | tee -a "$LOG_FILE"; then
              echo "ERROR: backup failed its integrity check — deploy aborted" | tee -a "$LOG_FILE"
              echo "Nothing has been changed on the server." | tee -a "$LOG_FILE"
              exit 1
            fi

            # Kept out of Frappe's own backup directory on purpose. Frappe prunes
            # that folder on its own schedule (keep_backups_for_hours), and a
            # deploy backup that quietly disappears before anyone notices a
            # problem is not a backup. This copy is ours and is pruned only by the
            # line at the bottom of this script.
            SAFE_DIR="$BENCH_PATH/deploy-backups"
            mkdir -p "$SAFE_DIR"
            STAMP=$(date +'%Y-%m-%d_%H-%M-%S')
            BACKUP_FILE="$SAFE_DIR/${STAMP}-predeploy-database.sql.gz"
            cp "$FRESH" "$BACKUP_FILE"

            # The site's own config travels with it: without site_config.json the
            # dump cannot be restored into a working site.
            cp "$BENCH_PATH/sites/$SITE/site_config.json" \
               "$SAFE_DIR/${STAMP}-predeploy-site_config.json" 2>/dev/null || true

            if [ ! -s "$BACKUP_FILE" ] || ! gzip -t "$BACKUP_FILE" 2>/dev/null; then
              echo "ERROR: the preserved copy is unreadable — deploy aborted" | tee -a "$LOG_FILE"
              exit 1
            fi

            echo "Backup taken   : $FRESH" | tee -a "$LOG_FILE"
            echo "Preserved copy : $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))" | tee -a "$LOG_FILE"
            echo "Integrity      : gzip -t passed on both" | tee -a "$LOG_FILE"
            echo "✅ Backup verified and preserved before any change" | tee -a "$LOG_FILE"

            # The commit the server is on right now. If anything below fails, the
            # code goes back to exactly this.
            cd "$APP_PATH" || { echo "ERROR: App path not found: $APP_PATH" | tee -a "$LOG_FILE"; exit 1; }
            ROLLBACK_COMMIT=$(git rev-parse HEAD)
            echo "Rollback point: $ROLLBACK_COMMIT" | tee -a "$LOG_FILE"

            # Anything edited directly on the server is stashed, not discarded.
            # git pull would refuse to run over it, and the rollback below does a
            # hard reset -- either way an uncommitted hotfix somebody made on live
            # would be gone. Stashing keeps it recoverable with `git stash list`.
            if [ -n "$(git status --porcelain)" ]; then
              echo "" | tee -a "$LOG_FILE"
              echo "NOTE: the server has uncommitted local changes:" | tee -a "$LOG_FILE"
              git status --short | tee -a "$LOG_FILE"
              STASH_LABEL="pre-deploy $(date +'%Y-%m-%d %H:%M:%S')"
              git stash push -u -m "$STASH_LABEL" 2>&1 | tee -a "$LOG_FILE"
              echo "They have been stashed as: $STASH_LABEL" | tee -a "$LOG_FILE"
              echo "Recover with:  cd $APP_PATH && git stash list && git stash pop" | tee -a "$LOG_FILE"
              echo "" | tee -a "$LOG_FILE"
            fi

            # ── Rollback, used by every failure below ────────────────────────
            # The code is put back automatically: that is safe, and it fixes the
            # common failures (a bad build, an import error, a broken client
            # script) by returning the site to the version that was working.
            #
            # The DATABASE is deliberately NOT restored automatically. A restore
            # would discard every transaction users have made since the backup was
            # taken minutes earlier, and on a live ERP that is worse than the
            # failure it is trying to undo. The exact command is printed instead,
            # so a human decides.
            rollback() {
              REASON="$1"
              echo "" | tee -a "$LOG_FILE"
              echo "============================================" | tee -a "$LOG_FILE"
              echo " ROLLING BACK — $REASON" | tee -a "$LOG_FILE"
              echo "============================================" | tee -a "$LOG_FILE"

              cd "$APP_PATH" && git reset --hard "$ROLLBACK_COMMIT" 2>&1 | tee -a "$LOG_FILE"
              cd "$BENCH_PATH" || exit 1
              bench build --app manufyxinvenzaerp 2>&1 | tee -a "$LOG_FILE" || true
              bench --site "$SITE" clear-cache 2>&1 | tee -a "$LOG_FILE" || true
              bench restart 2>&1 | tee -a "$LOG_FILE" || true

              echo "" | tee -a "$LOG_FILE"
              echo "Code is back on $ROLLBACK_COMMIT and the site has been restarted." | tee -a "$LOG_FILE"
              echo "" | tee -a "$LOG_FILE"
              echo "If the DATABASE also needs restoring, run this on the server:" | tee -a "$LOG_FILE"
              echo "  cd $BENCH_PATH" | tee -a "$LOG_FILE"
              echo "  bench --site $SITE restore $BACKUP_FILE" | tee -a "$LOG_FILE"
              echo "" | tee -a "$LOG_FILE"
              echo "That discards anything done on the site since the backup, so check first." | tee -a "$LOG_FILE"

              # Recorded AFTER the code has been reset and the site restarted, so
              # the app is back on a known-good commit and can be asked to write
              # the record. Doing it before the reset would ask a half-deployed
              # app to log its own failure.
              record_deploy_log "Rolled Back" "$REASON"

              exit 1
            }

            # ── Step 1: Git Pull ─────────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 1/6] Git Pull" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            git pull 2>&1 | tee -a "$LOG_FILE"
            GIT_STATUS=${PIPESTATUS[0]}

            if [ $GIT_STATUS -ne 0 ]; then
              echo "ERROR: git pull failed with exit code $GIT_STATUS" | tee -a "$LOG_FILE"
              rollback "git pull failed"
            fi
            echo "✅ Git pull successful" | tee -a "$LOG_FILE"

            # ── Step 2: Bench Build ──────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 2/6] Bench Build — compiling JS/CSS/Vue assets" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            cd "$BENCH_PATH" || { echo "ERROR: Bench path not found" | tee -a "$LOG_FILE"; exit 1; }

            bench build --app manufyxinvenzaerp 2>&1 | tee -a "$LOG_FILE"
            BUILD_STATUS=${PIPESTATUS[0]}

            if [ $BUILD_STATUS -ne 0 ]; then
              echo "ERROR: bench build failed with exit code $BUILD_STATUS" | tee -a "$LOG_FILE"
              rollback "bench build failed"
            fi
            echo "✅ Bench build successful" | tee -a "$LOG_FILE"

            # ── Step 3: Clear Cache ──────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 3/6] Clear Cache — removing stale metadata & controllers" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench --site "$SITE" clear-cache 2>&1 | tee -a "$LOG_FILE"
            CACHE_STATUS=${PIPESTATUS[0]}

            if [ $CACHE_STATUS -ne 0 ]; then
              echo "ERROR: clear-cache failed with exit code $CACHE_STATUS" | tee -a "$LOG_FILE"
              rollback "clear-cache failed"
            fi
            echo "✅ Cache cleared successfully" | tee -a "$LOG_FILE"

            # ── Step 4: Bench Migrate ────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 4/6] Bench Migrate — applying schema changes" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench --site "$SITE" migrate 2>&1 | tee -a "$LOG_FILE"
            MIGRATE_STATUS=${PIPESTATUS[0]}

            if [ $MIGRATE_STATUS -ne 0 ]; then
              echo "ERROR: bench migrate failed with exit code $MIGRATE_STATUS" | tee -a "$LOG_FILE"
              echo "A failed migrate is the one case where the database may also need" | tee -a "$LOG_FILE"
              echo "restoring — the schema may be part-changed. Read the command below." | tee -a "$LOG_FILE"
              rollback "bench migrate failed"
            fi
            echo "✅ Bench migrate successful" | tee -a "$LOG_FILE"

            # ── Step 5: Bench Restart ────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 5/6] Bench Restart — reloading workers & scheduler" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench restart 2>&1 | tee -a "$LOG_FILE"
            RESTART_STATUS=${PIPESTATUS[0]}

            if [ $RESTART_STATUS -ne 0 ]; then
              echo "ERROR: bench restart failed with exit code $RESTART_STATUS" | tee -a "$LOG_FILE"
              rollback "bench restart failed"
            fi
            echo "✅ Bench restart successful" | tee -a "$LOG_FILE"

            # ── Summary ──────────────────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"
            echo " ✅ DEPLOY COMPLETED SUCCESSFULLY"           | tee -a "$LOG_FILE"
            echo " Finished : $(date)"                         | tee -a "$LOG_FILE"
            echo " Log file : $LOG_FILE"                       | tee -a "$LOG_FILE"
            echo " Backup   : $BACKUP_FILE"                    | tee -a "$LOG_FILE"
            echo " (kept, in case something surfaces later)"   | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"

            # ── Record it in the ERP ─────────────────────────────────────────
            # Last, so the record covers the whole run including the restart. The
            # Python side prunes its own old records to the same count the server
            # keeps below, so a Deploy Log never outlives the file it points at.
            record_deploy_log "Completed" ""

            # ── Old log cleanup (keep last 20 deploys only) ──────────────────
            cd "$LOG_DIR" && ls -t | tail -n +21 | xargs -r rm --

            # ── Preserved backups: keep the last 10 deploys ──────────────────
            # Ten deploys back is far enough to cover a problem noticed days
            # later, and this prunes by count rather than age so a quiet week
            # cannot age them all out.
            cd "$SAFE_DIR" && ls -t *-predeploy-database.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --
            cd "$SAFE_DIR" && ls -t *-predeploy-site_config.json 2>/dev/null | tail -n +11 | xargs -r rm --

      - name: Notify Telegram - Deploy completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Live deploy completed. A pre-deploy database backup was taken and kept in frappe-bench/deploy-backups (last 10 retained)."

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout-deploy) STEP_DESC="Checkout code" ;;
            ssh-deploy) STEP_DESC="Live server update (SSH deploy)" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. The code was rolled back to the previous commit and the site restarted. A pre-deploy database backup is in frappe-bench/deploy-backups - the deploy log names the exact file and the restore command, if the database also needs putting back."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
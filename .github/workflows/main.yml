name: Deploy to Production

# Push to main deploys to the v16 server (frappe-v16 bench), once the repository
# variable LIVE_DEPLOY is "true". workflow_dispatch re-runs the same pipeline by
# hand (Actions → Deploy to Production → Run workflow) -- e.g. after a failed run
# whose cause was fixed on the server rather than in the code.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Deploy flags ─────────────────────────────────────────────────────────────
  # Read the commit tags ONCE, here, and let both jobs below branch on the answer.
  # The alternative -- repeating a contains() expression in two `if:` conditions --
  # has a failure mode worth avoiding: if the two ever disagree, the test job is
  # skipped while the deploy job still waits for it, and the pipeline hangs on a
  # job that will never run.
  #
  # Both the merge commit and every commit in the push are searched. The merge
  # commit is the reliable one (auto-merge-devbranch.yml puts the tag there on
  # purpose), and the rest covers a direct push to main that was never merged.
  prepare:
    name: Read deploy flags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      urgent: ${{ steps.flags.outputs.urgent }}
      tag: ${{ steps.flags.outputs.tag }}
    steps:
      - name: Detect [urgentfix]
        id: flags
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          ALL_MSGS: ${{ toJson(github.event.commits.*.message) }}
        run: |
          set -e
          if printf '%s\n%s' "$HEAD_MSG" "$ALL_MSGS" | grep -qF '[urgentfix]'; then
            echo "urgent=true" >> "$GITHUB_OUTPUT"
            echo "tag=urgentfix" >> "$GITHUB_OUTPUT"
            echo "[urgentfix] found — the test suite will be SKIPPED for this deploy."
          else
            echo "urgent=false" >> "$GITHUB_OUTPUT"
            echo "tag=autodeploy" >> "$GITHUB_OUTPUT"
            echo "No [urgentfix] tag — the test suite runs as usual."
          fi

  # ── Test gate ────────────────────────────────────────────────────────────────
  # Runs the app's full pytest/unittest suite (tests/) against a throwaway site
  # before the deploy job below is allowed to run. This is a new addition
  # (Phase 1 / HP-08, Report 3 Finding M-07) — previously this pipeline had no
  # test-execution step at all, so a regression the existing suite would catch
  # could still reach production. Runs on its own ephemeral MariaDB/Redis
  # instance, never against the production site — the deploy job is unchanged
  # below and still SSHes into production separately.
  test:
    name: Run App Test Suite
    runs-on: ubuntu-latest
    needs: prepare
    # [urgentfix] skips the gate. Everything after it is unchanged -- same backup,
    # same rollback, same log -- so what is being traded away is the warning, not
    # the safety net. The Deploy Log record is stamped Tests Skipped so a deploy
    # that went out untested stays identifiable long after the run has scrolled by.
    if: needs.prepare.outputs.urgent != 'true'
    # A whole-job cap. Individual steps carry their own where they are known to
    # be able to hang; this is the backstop so a run can never sit for an hour.
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11  # what the v16 migration was verified on
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Notify Telegram - Deployment started
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Deployment process initiated for Manufyxinvenza"

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7
        with:
          path: manufyxinvenzaerp

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # ERPNext v16 requires-python >=3.14

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: "24"  # frappe v16 engines: node >=24

      - name: Install system dependencies
        id: install-sysdeps
        # Was hanging for 6+ minutes and then being cancelled. Three changes:
        #
        #  * Only two packages are actually needed. redis comes from the service
        #    containers above on the very ports bench expects (13000/11000), so
        #    installing redis-server was pointless; wkhtmltopdf is only used to
        #    render PDFs at runtime, which no test does, and it drags in the whole
        #    X11 and font stack.
        #  * apt is told to give up on a stalled mirror instead of waiting on it
        #    forever, which is what the silence in the log was.
        #  * The step is capped, so a bad mirror costs four minutes and a clear
        #    failure rather than an open-ended hang someone has to cancel by hand.
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail

          need=""
          command -v mysql >/dev/null 2>&1 || need="$need mariadb-client"
          # mysqlclient builds against this; frappe v15 uses pymysql, but a
          # transitive dependency can still want the headers.
          dpkg -s libmysqlclient-dev >/dev/null 2>&1 || need="$need libmysqlclient-dev"

          if [ -z "$need" ]; then
            echo "Nothing to install — the runner image already has what is needed."
            exit 0
          fi

          echo "Installing:$need"
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=20 \
                    -o Acquire::https::Timeout=20 \
                    -o Acquire::ForceIPv4=true"

          # A single archive rather than the runner's mirror list: when one entry
          # in that list stalls, apt waits on it, and that is the hang.
          sudo -E apt-get $APT_OPTS update
          sudo -E apt-get $APT_OPTS install -y --no-install-recommends $need

      - name: Install bench
        id: install-bench
        run: pip install frappe-bench

      - name: Init bench + get apps
        id: init-bench
        run: |
          bench init --skip-redis-config-generation --python "$(which python3)" --frappe-branch version-16 test-bench
          cd test-bench
          bench get-app erpnext --branch version-16
          bench get-app hrms --branch version-16
          bench get-app india_compliance https://github.com/resilient-tech/india-compliance.git --branch version-16
          bench get-app manufyxinvenzaerp "$GITHUB_WORKSPACE/manufyxinvenzaerp"

      - name: Configure site + install apps
        id: configure-site
        working-directory: test-bench
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-config -g root_login root
          bench set-config -g root_password root
          bench new-site test-site.local --force \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test-site.local install-app erpnext
          # The base records a real site gets from the setup wizard: the Item Group
          # tree ("All Item Groups"), the units of measure ("Kg", "Nos"), territories
          # and the rest. A CI site never runs the wizard, so without this every test
          # that creates an Item fails in setUpClass with "Could not find Parent Item
          # Group: All Item Groups, Default Unit of Measure: Kg". Before the apps
          # below, whose own install builds on the item groups.
          bench --site test-site.local execute erpnext.setup.setup_wizard.operations.install_fixtures.install --args "['India']"
          bench --site test-site.local install-app hrms
          bench --site test-site.local install-app india_compliance
          bench --site test-site.local install-app manufyxinvenzaerp

      - name: Run test suite
        id: run-tests
        working-directory: test-bench
        run: bench --site test-site.local run-tests --app manufyxinvenzaerp

      - name: Notify Telegram - Test environment completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Completed test environment, moving to live server update"

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout) STEP_DESC="Checkout code" ;;
            setup-python) STEP_DESC="Setup Python" ;;
            setup-node) STEP_DESC="Setup Node" ;;
            install-sysdeps) STEP_DESC="Install system dependencies" ;;
            install-bench) STEP_DESC="Install bench" ;;
            init-bench) STEP_DESC="Init bench + get apps" ;;
            configure-site) STEP_DESC="Configure site + install apps" ;;
            run-tests) STEP_DESC="Run test suite" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. Remaining steps stopped, deploy will not run."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # The v16 server (since 2026-10) runs ONE bench for several sites. Two rules follow
  # from that, and this job is built around them:
  #
  #   * App code is per bench, not per site. Pulling this app changes what EVERY site
  #     with manufyxinvenzaerp installed runs, so every such site is backed up and
  #     migrated together -- a site left un-migrated would run new code on an old
  #     schema. Sites without the app are not touched at all: no backup, no cache
  #     clear, no migrate.
  #   * `bench restart` restarts the web server for the whole bench -- every site goes
  #     502 for a few seconds. So it is not used. The web server is reloaded
  #     gracefully (gunicorn HUP: new workers start, old ones finish their requests),
  #     and the background workers are restarted, which no user sees.
  #     HUP only loads new code when gunicorn runs WITHOUT --preload, which bench
  #     puts in by default; see the setup notes in the deploy log if it is still there.
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: [prepare, test]
    timeout-minutes: 40
    # The live server is only touched when the repository variable LIVE_DEPLOY is
    # set to "true" (Settings → Secrets and variables → Actions → Variables).
    # With it unset the test gate still runs on every push, so the pipeline can be
    # exercised and watched without deploying anything.
    #
    # The rest of this condition is what lets [urgentfix] through. A skipped `needs`
    # job normally skips everything downstream, so a plain `needs: test` would mean
    # an urgent fix merged and then deployed nothing at all -- the quietest possible
    # way to fail. !cancelled() lifts that, and the explicit result check puts the
    # gate back: success or skipped may deploy, FAILED may not. Spelling out the two
    # allowed results rather than writing `!= 'failure'` also covers a test job that
    # ends up cancelled or timed out.
    if: >-
      !cancelled()
      && vars.LIVE_DEPLOY == 'true'
      && needs.prepare.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        id: checkout-deploy
        uses: actions/checkout@v7

      - name: Deploy to Frappe Server
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
          TESTS_SKIPPED: ${{ needs.prepare.outputs.urgent == 'true' && '1' || '0' }}
          # Repository variables (Settings → Secrets and variables → Actions →
          # Variables). BENCH_PATH is the bench folder -- the one holding apps/ and
          # sites/. DEPLOY_SITES is optional: leave it unset and every site with this
          # app installed is deployed, which is what you want; set it (space
          # separated) only to name them explicitly. A site that has the app but is
          # missing from DEPLOY_SITES stops the deploy before anything changes.
          BENCH_PATH: ${{ vars.BENCH_PATH }}
          DEPLOY_SITES: ${{ vars.DEPLOY_SITES }}
        with:
          # Forwarded into the remote shell. The commit sha, message and branch are
          # read from git on the server instead, because a commit message with a
          # quote in it would otherwise have to survive a round trip through two
          # shells.
          envs: DEPLOY_TAG,TESTS_SKIPPED,BENCH_PATH,DEPLOY_SITES
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # ── Setup ────────────────────────────────────────────────────────
            # A non-interactive SSH shell does not read ~/.bashrc, so bench (pipx,
            # ~/.local/bin) and Node 24 (nvm, which frappe v16 needs to build) are
            # put on PATH here or `bench` is simply "command not found".
            export PATH="$HOME/.local/bin:$PATH"
            # nvm loads its DEFAULT alias, which on this server was Node 20 -- the build
            # then died with "The engine node is incompatible ... Expected >=24". Ask for
            # 24 explicitly; `nvm alias default 24` on the server makes it the default too.
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1
              nvm use 24 >/dev/null 2>&1 || true
            fi

            APP="manufyxinvenzaerp"
            BENCH_PATH="${BENCH_PATH:-$HOME/frappe-v16}"
            BENCH_NAME="$(basename "$BENCH_PATH")"
            APP_PATH="$BENCH_PATH/apps/$APP"
            LOG_DIR="$BENCH_PATH/Auto-deploy-logs"
            LOG_FILE="$LOG_DIR/deploy_$(date +'%Y-%m-%d_%H-%M-%S').log"
            SAFE_DIR="$BENCH_PATH/deploy-backups"
            DEPLOY_STARTED="$(date +'%Y-%m-%d %H:%M:%S')"
            DEPLOY_TAG="${DEPLOY_TAG:-autodeploy}"
            TESTS_SKIPPED="${TESTS_SKIPPED:-0}"
            ROLLBACK_COMMIT=""
            SITES=""
            BACKUPS=""

            mkdir -p "$LOG_DIR"
            log() { echo "$*" | tee -a "$LOG_FILE"; }
            step() { log ""; log "$1"; log "--------------------------------------------"; }

            cd "$BENCH_PATH" || { log "ERROR: Bench path not found: $BENCH_PATH"; exit 1; }

            # ── Deploy Log → ERP ─────────────────────────────────────────────
            # The log this script writes lives on the server, readable only over
            # SSH -- which is exactly the person who cannot read it when a deploy
            # fails out of hours. This copies the same log into a Deploy Log record
            # on every deployed site so it can be read from the ERP itself.
            #
            # Every call is swallowed. A deploy that actually worked must never be
            # reported as failed because recording it failed. Built up in one
            # variable rather than a multi-line command: every line of this script
            # sits inside a YAML block scalar, and a backslash continuation that
            # starts at column 0 ends the block early and breaks the workflow file.
            record_deploy_log() {
              STATUS="$1"
              FAILED_STEP="${2:-}"
              cd "$BENCH_PATH" 2>/dev/null || return 0
              for S in $SITES; do
                BK=$(echo "$BACKUPS" | tr ' ' '\n' | grep -F "/${S}--" | head -n1)
                KW="{'status': '$STATUS'"
                KW="$KW, 'log_file': '$LOG_FILE'"
                KW="$KW, 'started': '$DEPLOY_STARTED'"
                KW="$KW, 'site': '$S'"
                KW="$KW, 'backup_file': '$BK'"
                KW="$KW, 'rollback_commit': '$ROLLBACK_COMMIT'"
                KW="$KW, 'failed_step': '$FAILED_STEP'"
                KW="$KW, 'trigger_tag': '$DEPLOY_TAG'"
                KW="$KW, 'tests_skipped': '$TESTS_SKIPPED'}"
                bench --site "$S" execute "$APP.deploy_log.record" --kwargs "$KW" >/dev/null 2>&1 || true
              done
            }

            # ── Reload without taking other sites down ───────────────────────
            # Web: gunicorn HUP through supervisor -- new workers come up on the new
            # code while the old ones finish what they are serving, so no site sees
            # a 502. That only works without --preload (a preloaded master hands the
            # OLD code to every new worker); with it the web group is restarted
            # instead, a few seconds of 502 for every site on the bench, and the log
            # says how to remove --preload so the next deploy is seamless.
            # Workers: restarted. A background job in progress is finished first
            # (RQ warm shutdown); nobody using a site notices.
            # No supervisor access (sudo) at all: plain `bench restart`.
            reload_processes() {
              if ! sudo -n supervisorctl status >/dev/null 2>&1; then
                log "WARNING: no passwordless sudo for supervisorctl -- using bench restart (all sites restart)."
                log "Fix once:  sudo bench setup sudoers \$USER"
                bench restart 2>&1 | tee -a "$LOG_FILE"
                return ${PIPESTATUS[0]}
              fi
              WEB="${BENCH_NAME}-web:${BENCH_NAME}-frappe-web"
              if pgrep -u "$(id -u)" -f "$BENCH_PATH/env/bin/gunicorn.*--preload" >/dev/null; then
                log "NOTE: gunicorn runs with --preload, so a graceful reload cannot load new code."
                log "      Restarting the web server instead: a few seconds of 502 for every site."
                log "      For zero-downtime deploys, remove '--preload' from the frappe-web command in"
                log "      $BENCH_PATH/config/supervisor.conf, then: sudo supervisorctl reread && sudo supervisorctl update"
                sudo -n supervisorctl restart "$WEB" 2>&1 | tee -a "$LOG_FILE"
                WEB_STATUS=${PIPESTATUS[0]}
              else
                sudo -n supervisorctl signal HUP "$WEB" 2>&1 | tee -a "$LOG_FILE"
                WEB_STATUS=${PIPESTATUS[0]}
                log "Web server reloaded gracefully (HUP) -- no downtime for any site."
              fi
              sudo -n supervisorctl restart "${BENCH_NAME}-workers:" 2>&1 | tee -a "$LOG_FILE"
              WORKER_STATUS=${PIPESTATUS[0]}
              [ "$WEB_STATUS" -eq 0 ] && [ "$WORKER_STATUS" -eq 0 ]
            }

            # ── Preflight: refuse BEFORE the backup if the deploy cannot finish ──
            # Both of these failed the first v16 deploy halfway, after the code had
            # been pulled: the build (Node too old) and the restart (no sudo for
            # supervisorctl -- which `bench restart` needs as well). Checked first,
            # so a server that is not ready is reported, not half-deployed.
            NODE_MAJOR=$(node -v 2>/dev/null | sed 's/^v//; s/\..*//')
            if [ -z "$NODE_MAJOR" ] || [ "$NODE_MAJOR" -lt 24 ]; then
              log "ERROR: Node $(node -v 2>/dev/null || echo 'not found') -- frappe v16 needs Node 24 to build."
              log "Fix once on the server (as $USER):  nvm install 24 && nvm alias default 24"
              log "Nothing has been changed on the server."
              exit 1
            fi
            if ! sudo -n supervisorctl status >/dev/null 2>&1; then
              log "ERROR: $USER cannot run 'sudo supervisorctl' without a password, so the"
              log "processes cannot be restarted (bench restart needs it too)."
              log "Fix once on the server:  cd $BENCH_PATH && sudo bench setup sudoers $USER"
              log "Nothing has been changed on the server."
              exit 1
            fi

            log "============================================"
            log " AUTO DEPLOY STARTED"
            log " Date     : $(date)"
            log " Bench    : $BENCH_PATH"
            log " App Path : $APP_PATH"
            log "============================================"

            # ── Which sites ──────────────────────────────────────────────────
            # Every site with this app installed shares its code, so every one of
            # them is deployed. Read from each site's own installed-apps list.
            step "[STEP 0/6] Sites with $APP installed"
            INSTALLED=""
            for D in "$BENCH_PATH"/sites/*/; do
              S="$(basename "$D")"
              [ -f "$D/site_config.json" ] || continue
              if bench --site "$S" list-apps 2>/dev/null | grep -qw "$APP"; then
                INSTALLED="$INSTALLED $S"
              fi
            done
            INSTALLED="$(echo $INSTALLED)"
            if [ -z "$INSTALLED" ]; then
              log "ERROR: no site on this bench has $APP installed -- nothing to deploy."
              exit 1
            fi
            if [ -n "$DEPLOY_SITES" ]; then
              for S in $INSTALLED; do
                if ! echo " $DEPLOY_SITES " | grep -q " $S "; then
                  log "ERROR: $S has $APP installed but is not in DEPLOY_SITES ($DEPLOY_SITES)."
                  log "It would run the new code on an old schema. Add it, or uninstall the app from it."
                  log "Nothing has been changed on the server."
                  exit 1
                fi
              done
            fi
            SITES="$INSTALLED"
            log "Deploying to : $SITES"
            log "Not touched  : every other site on this bench"

            # ── Backup, before anything is touched ───────────────────────────
            # Nothing below runs until every deployed site has a database backup on
            # disk that reads back as a valid gzip. A deploy that cannot be undone
            # is not a deploy anyone should start. Kept outside Frappe's own backup
            # folder, which Frappe prunes on its own schedule.
            step "[STEP 1/6] Backup — taken before any change"
            mkdir -p "$SAFE_DIR"
            STAMP=$(date +'%Y-%m-%d_%H-%M-%S')
            for S in $SITES; do
              bench --site "$S" backup 2>&1 | tee -a "$LOG_FILE"
              if [ ${PIPESTATUS[0]} -ne 0 ]; then
                log "ERROR: backup of $S failed — deploy aborted. Nothing has been changed."
                exit 1
              fi
              FRESH=$(ls -t "$BENCH_PATH/sites/$S/private/backups/"*-database.sql.gz 2>/dev/null | head -n1)
              if [ -z "$FRESH" ] || [ ! -s "$FRESH" ] || ! gzip -t "$FRESH" 2>>"$LOG_FILE"; then
                log "ERROR: no readable backup for $S — deploy aborted. Nothing has been changed."
                exit 1
              fi
              # Named <site>--<stamp> so each site's backups can be told apart and
              # pruned on their own.
              COPY="$SAFE_DIR/${S}--${STAMP}-predeploy-database.sql.gz"
              cp "$FRESH" "$COPY"
              cp "$BENCH_PATH/sites/$S/site_config.json" "$SAFE_DIR/${S}--${STAMP}-predeploy-site_config.json" 2>/dev/null || true
              if [ ! -s "$COPY" ] || ! gzip -t "$COPY" 2>/dev/null; then
                log "ERROR: the preserved copy for $S is unreadable — deploy aborted."
                exit 1
              fi
              BACKUPS="$BACKUPS $COPY"
              log "✅ $S backed up: $COPY ($(du -h "$COPY" | cut -f1))"
            done

            # The commit the server is on right now. If anything below fails, the
            # code goes back to exactly this.
            cd "$APP_PATH" || { log "ERROR: App path not found: $APP_PATH"; exit 1; }
            ROLLBACK_COMMIT=$(git rev-parse HEAD)
            log "Rollback point: $ROLLBACK_COMMIT"

            # Anything edited directly on the server is stashed, not discarded.
            # git pull would refuse to run over it, and the rollback below does a
            # hard reset -- either way an uncommitted hotfix somebody made on live
            # would be gone. Stashing keeps it recoverable with `git stash list`.
            if [ -n "$(git status --porcelain)" ]; then
              log ""
              log "NOTE: the server has uncommitted local changes:"
              git status --short | tee -a "$LOG_FILE"
              STASH_LABEL="pre-deploy $(date +'%Y-%m-%d %H:%M:%S')"
              git stash push -u -m "$STASH_LABEL" 2>&1 | tee -a "$LOG_FILE"
              log "They have been stashed as: $STASH_LABEL"
              log "Recover with:  cd $APP_PATH && git stash list && git stash pop"
            fi

            # ── Rollback, used by every failure below ────────────────────────
            # The code is put back automatically: that is safe, and it fixes the
            # common failures (a bad build, an import error, a broken client
            # script) by returning the sites to the version that was working.
            #
            # The DATABASE is deliberately NOT restored automatically. A restore
            # would discard every transaction users have made since the backup was
            # taken minutes earlier. The exact commands are printed instead.
            rollback() {
              REASON="$1"
              log ""
              log "============================================"
              log " ROLLING BACK — $REASON"
              log "============================================"
              cd "$APP_PATH" && git reset --hard "$ROLLBACK_COMMIT" 2>&1 | tee -a "$LOG_FILE"
              cd "$BENCH_PATH" || exit 1
              bench build --app "$APP" 2>&1 | tee -a "$LOG_FILE" || true
              for S in $SITES; do
                bench --site "$S" clear-cache 2>&1 | tee -a "$LOG_FILE" || true
              done
              reload_processes || true
              log ""
              log "Code is back on $ROLLBACK_COMMIT and reloaded."
              log ""
              log "If a DATABASE also needs restoring, run on the server (per site):"
              for B in $BACKUPS; do
                S=$(basename "$B" | sed 's/--.*//')
                log "  cd $BENCH_PATH && bench --site $S restore $B"
              done
              log "That discards anything done on the site since the backup, so check first."
              # After the reset, so a known-good app writes its own failure record.
              record_deploy_log "Rolled Back" "$REASON"
              exit 1
            }

            # ── Git Pull ─────────────────────────────────────────────────────
            # --ff-only: the server only ever moves forward along main. A server
            # checkout that has diverged is a problem to look at, not to merge into.
            step "[STEP 2/6] Git Pull"
            git pull --ff-only 2>&1 | tee -a "$LOG_FILE"
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              rollback "git pull failed"
            fi
            log "✅ Now on $(git rev-parse --short HEAD): $(git log -1 --format=%s)"

            # ── Build this app's assets only ─────────────────────────────────
            step "[STEP 3/6] Bench Build — $APP assets only"
            cd "$BENCH_PATH" || exit 1
            bench build --app "$APP" 2>&1 | tee -a "$LOG_FILE"
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              rollback "bench build failed"
            fi
            log "✅ Build successful"

            # ── Per site: clear cache, migrate ───────────────────────────────
            step "[STEP 4/6] Clear cache + migrate — $SITES"
            for S in $SITES; do
              log "· $S: clear-cache"
              bench --site "$S" clear-cache 2>&1 | tee -a "$LOG_FILE"
              if [ ${PIPESTATUS[0]} -ne 0 ]; then
                rollback "clear-cache failed on $S"
              fi
              log "· $S: migrate"
              bench --site "$S" migrate 2>&1 | tee -a "$LOG_FILE"
              if [ ${PIPESTATUS[0]} -ne 0 ]; then
                log "A failed migrate is the one case where the database may also need"
                log "restoring — the schema may be part-changed. Read the commands below."
                rollback "bench migrate failed on $S"
              fi
              log "✅ $S migrated"
            done

            # ── Reload ───────────────────────────────────────────────────────
            step "[STEP 5/6] Reload — graceful, other sites stay up"
            if ! reload_processes; then
              rollback "reload failed"
            fi
            log "✅ Reloaded"

            # ── Summary ──────────────────────────────────────────────────────
            step "[STEP 6/6] Done"
            log "============================================"
            log " ✅ DEPLOY COMPLETED SUCCESSFULLY"
            log " Sites    : $SITES"
            log " Finished : $(date)"
            log " Log file : $LOG_FILE"
            log " Backups  : $BACKUPS"
            log "============================================"

            # Last, so the record covers the whole run including the reload.
            record_deploy_log "Completed" ""

            # ── Retention ────────────────────────────────────────────────────
            # Logs: last 20 deploys. Backups: last 10 per site, by count rather than
            # age so a quiet week cannot age them all out.
            cd "$LOG_DIR" && ls -t | tail -n +21 | xargs -r rm --
            for S in $SITES; do
              cd "$SAFE_DIR" && ls -t "${S}--"*-predeploy-database.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --
              cd "$SAFE_DIR" && ls -t "${S}--"*-predeploy-site_config.json 2>/dev/null | tail -n +11 | xargs -r rm --
            done

      - name: Notify Telegram - Deploy completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Live deploy completed on every site with Manufyxinvenza installed; other sites on the bench were not touched. Pre-deploy backups are in <bench>/deploy-backups (last 10 per site)."

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout-deploy) STEP_DESC="Checkout code" ;;
            ssh-deploy) STEP_DESC="Live server update (SSH deploy)" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. If it got past the backup, the code was rolled back to the previous commit and reloaded. Pre-deploy backups are in <bench>/deploy-backups - the deploy log names each file and the restore command, if a database also needs putting back."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
